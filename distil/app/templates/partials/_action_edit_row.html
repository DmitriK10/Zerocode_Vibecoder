<tr id="action-{{ action.id }}" class="border-t border-slate-100 align-top bg-blue-50/40">
  <td class="px-3 py-2 text-slate-500">{{ action.id }}</td>
  <td colspan="6" class="px-3 py-2">
    {% if error %}
      <div class="mb-2 px-2 py-1 rounded bg-red-50 border border-red-300 text-red-800 text-xs">
        {{ error }}
      </div>
    {% endif %}
    <form hx-patch="/web/actions/{{ action.id }}"
          hx-target="#action-{{ action.id }}"
          hx-swap="outerHTML"
          class="grid grid-cols-1 md:grid-cols-6 gap-2 text-xs">
      <label class="md:col-span-3">
        <span class="block text-slate-600 mb-0.5">Заголовок</span>
        <input name="title" value="{{ action.title }}"
               class="w-full border border-slate-300 rounded px-2 py-1">
      </label>
      <label>
        <span class="block text-slate-600 mb-0.5">Ответственный</span>
        <input name="assignee" value="{{ action.assignee or '' }}"
               class="w-full border border-slate-300 rounded px-2 py-1">
      </label>
      <label>
        <span class="block text-slate-600 mb-0.5">Срок (ISO)</span>
        <input name="due_date" value="{{ action.due_date or '' }}"
               placeholder="YYYY-MM-DD"
               class="w-full border border-slate-300 rounded px-2 py-1">
      </label>
      <label>
        <span class="block text-slate-600 mb-0.5">Приоритет</span>
        <select name="priority"
                class="w-full border border-slate-300 rounded px-2 py-1">
          {% for p in ["low", "medium", "high"] %}
            <option value="{{ p }}" {% if action.priority.value == p %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="md:col-span-6 flex justify-end gap-2 mt-1">
        <button type="button"
                hx-get="/web/actions/{{ action.id }}/row"
                hx-target="#action-{{ action.id }}"
                hx-swap="outerHTML"
                class="px-3 py-1 rounded border border-slate-300">Отмена</button>
        <button type="submit"
                class="px-3 py-1 rounded bg-blue-600 text-white hover:bg-blue-700">Сохранить</button>
      </div>
    </form>
  </td>
</tr>
