<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Distil{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    [hx-swap] { transition: opacity 0.15s; }
    .htmx-request { opacity: 0.55; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-semibold text-lg tracking-tight">Distil</a>
      <nav class="flex gap-4 text-sm">
        <a class="hover:text-blue-600" href="/">Витрина</a>
        <a class="hover:text-blue-600" href="/audit">Аудит</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% if flash %}{% include "partials/_flash.html" %}{% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-xs text-slate-500">
    Distil — из текста в действия, с ручной проверкой.
  </footer>
</body>
</html>
