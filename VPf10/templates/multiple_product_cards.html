<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Карточки товаров</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #fafafa;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .card .name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px;
        }
        .card .price {
            font-size: 22px;
            color: #e67e22;
            margin: 5px 0;
        }
        .card .description {
            font-size: 14px;
            color: #555;
            margin: 10px 0;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Карточки товаров</h1>
    <div class="grid">
        {% for product in products %}
        <div class="card">
            {% if product.image_base64 %}
                <img src="data:image/png;base64,{{ product.image_base64 }}" alt="{{ product.product_name }}">
            {% else %}
                <div style="background:#eee; padding:30px; color:#999;">Изображение не доступно</div>
            {% endif %}
            <div class="name">{{ product.product_name }}</div>
            <div class="price">{{ product.price }}</div>
            <div class="description">{{ product.description }}</div>
        </div>
        {% endfor %}
    </div>
    <div class="footer">Сгенерировано {{ date }}</div>
</body>
</html>
