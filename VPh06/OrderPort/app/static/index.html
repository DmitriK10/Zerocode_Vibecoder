<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка - Айхор Хостинг</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background: #f8f9fa; border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        label { font-weight: 600; display: block; margin-top: 12px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 6px 0 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 14px 28px; margin-top: 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 12px; border-radius: 6px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .required:after { content: " *"; color: red; }
    </style>
</head>
<body>
    <h1>Оставить заявку</h1>
    <form id="leadForm">
        <label class="required">Имя</label>
        <input type="text" id="name" placeholder="Введите ваше имя" required>

        <label class="required">Телефон</label>
        <input type="tel" id="phone" placeholder="+7 (999) 123-45-67" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="example@mail.com">

        <label>Информация о бизнесе</label>
        <textarea id="business_info" rows="3" placeholder="Опишите ваш бизнес"></textarea>

        <label>Ниша бизнеса</label>
        <input type="text" id="business_niche" placeholder="Например, IT, производство">

        <label>Размер компании</label>
        <select id="company_size">
            <option value="">Не указано</option>
            <option value="small">Маленькая</option>
            <option value="medium">Средняя</option>
            <option value="large">Крупная</option>
        </select>

        <label>Объём задачи</label>
        <select id="task_volume">
            <option value="">Не указано</option>
            <option value="low">Низкий</option>
            <option value="medium">Средний</option>
            <option value="high">Высокий</option>
        </select>

        <label>Ваша роль</label>
        <input type="text" id="role" placeholder="Например, директор, менеджер">

        <label>Бюджет</label>
        <input type="text" id="budget" placeholder="например, 500 000 руб.">

        <label>Удобный способ связи</label>
        <select id="preferred_contact">
            <option value="phone">Телефон</option>
            <option value="email">Email</option>
            <option value="telegram">Telegram</option>
            <option value="whatsapp">WhatsApp</option>
        </select>

        <label>Выберите услугу</label>
        <select id="service_id">
            <option value="">Загрузка услуг...</option>
        </select>

        <label>Комментарии</label>
        <textarea id="comments" rows="3" placeholder="Дополнительная информация"></textarea>

        <button type="submit">Отправить заявку</button>
    </form>
    <div id="result"></div>

    <script>
        // ---- Сбор метрик ----
        const startTime = performance.now();
        let clicks = 0;
        let scrollDepth = 0;
        let sessionStart = Date.now();
        // Массив для хранения координат курсора
        let cursorPositions = [];
        // Для принудительного сбора (если мышь не двигалась)
        let lastX = 0, lastY = 0;

        console.log('Скрипт загружен. cursorPositions init:', cursorPositions); // отладка

        document.addEventListener('click', () => clicks++);
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            if (docHeight > 0) {
                scrollDepth = Math.round((scrollTop / docHeight) * 100);
            }
        });

        // Сбор координат курсора (ограничим 500 точек)
        document.addEventListener('mousemove', (e) => {
            lastX = e.clientX;
            lastY = e.clientY;
            if (cursorPositions.length < 500) {
                cursorPositions.push({ x: e.clientX, y: e.clientY });
            }
        });

        // Принудительная запись позиции каждые 100 мс (если мышь неподвижна)
        setInterval(() => {
            if ((lastX !== 0 || lastY !== 0) && cursorPositions.length < 500) {
                cursorPositions.push({ x: lastX, y: lastY });
            }
        }, 100);

        // ---- Загрузка услуг ----
        async function loadServices() {
            const select = document.getElementById('service_id');
            try {
                const resp = await fetch('/api/v1/admin-settings/');
                if (!resp.ok) throw new Error('Не удалось загрузить услуги');
                const services = await resp.json();
                select.innerHTML = '<option value="">Выберите услугу</option>';
                services.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.services} (${s.budget_range})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Ошибка загрузки услуг:', err);
                select.innerHTML = '<option value="">Ошибка загрузки</option>';
            }
        }
        loadServices();

        // ---- Отправка формы ----
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const businessInfo = document.getElementById('business_info').value.trim();
            const businessNiche = document.getElementById('business_niche').value.trim();
            const companySize = document.getElementById('company_size').value;
            const taskVolume = document.getElementById('task_volume').value;
            const role = document.getElementById('role').value.trim();
            const budget = document.getElementById('budget').value.trim();
            const preferredContact = document.getElementById('preferred_contact').value;
            const comments = document.getElementById('comments').value.trim();
            const serviceId = document.getElementById('service_id').value;

            if (!name || !phone) {
                document.getElementById('result').innerHTML = `<div class="error">Пожалуйста, заполните имя и телефон.</div>`;
                return;
            }
            if (!serviceId) {
                document.getElementById('result').innerHTML = `<div class="error">Пожалуйста, выберите услугу.</div>`;
                return;
            }

            const sessionId = localStorage.getItem('session_id') || (() => {
                const sid = 'sess_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('session_id', sid);
                return sid;
            })();

            const pageLoadTime = performance.now() - startTime;
            const sessionDuration = (Date.now() - sessionStart) / 1000;

            console.log('Перед отправкой cursorPositions:', cursorPositions.length); // отладка

            // Если координаты не собраны, добавим хотя бы одну (центр экрана)
            if (cursorPositions.length === 0) {
                cursorPositions.push({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            }

            const leadPayload = {
                contact_data: {
                    name: name,
                    phone: phone,
                    email: email || null
                },
                business_info: businessInfo || null,
                business_niche: businessNiche || null,
                company_size: companySize || null,
                task_volume: taskVolume || null,
                role: role || null,
                budget: budget || null,
                preferred_contact: preferredContact,
                comments: comments || null,
                user_agent: navigator.userAgent,
                referer: document.referrer || '',
                session_id: sessionId,
                page_load_time: pageLoadTime,
                service_id: parseInt(serviceId, 10)
            };

            try {
                // 1. Отправляем заявку
                const leadResp = await fetch('/api/v1/leads/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leadPayload)
                });
                const leadData = await leadResp.json();
                if (!leadResp.ok) {
                    document.getElementById('result').innerHTML = `<div class="error">❌ Ошибка: ${leadData.detail || 'Неизвестная ошибка'}</div>`;
                    return;
                }

                // 2. Отправляем метрики поведения
                const metricsPayload = {
                    lead_id: leadData.id,
                    page_load_time: pageLoadTime,
                    session_duration: sessionDuration,
                    clicks: clicks,
                    scroll_depth: scrollDepth,
                    other_metrics: {
                        screen_width: window.screen.width,
                        screen_height: window.screen.height,
                        language: navigator.language,
                        cursor_positions: JSON.stringify(cursorPositions)
                    }
                };
                console.log('Отправляю метрики с координатами:', cursorPositions); // отладка

                await fetch('/api/v1/behavior-metrics/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(metricsPayload)
                });

                document.getElementById('result').innerHTML = `<div class="success">✅ Заявка принята! ID: ${leadData.id}</div>`;
                document.getElementById('leadForm').reset();
                // сбросить счётчики
                clicks = 0;
                scrollDepth = 0;
                sessionStart = Date.now();
                cursorPositions = [];
                lastX = lastY = 0;
            } catch (err) {
                document.getElementById('result').innerHTML = `<div class="error">❌ Ошибка сети: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
