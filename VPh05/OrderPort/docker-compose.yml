services:
  postgres:
    image: docker.io/postgres:15-alpine
    container_name: orderport_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_orderport:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderport_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderport_backend
    env_file:
      - .env
    # volumes:                         # <-- закомментировано для исправления ошибки импортов
    #   - ./app:/app/app               # <-- закомментировано
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orderport_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  nginx:
    image: docker.io/nginx:alpine
    container_name: orderport_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - orderport_network
    command: nginx -c /etc/nginx/nginx.conf -g 'daemon off;'

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: orderport_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - orderport_network

  registry:
    image: docker.io/registry:2
    container_name: orderport_registry
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    restart: always
    networks:
      - orderport_network

volumes:
  postgres_data_orderport:
  pgadmin_data:
  registry_data:

networks:
  orderport_network:
    driver: bridge